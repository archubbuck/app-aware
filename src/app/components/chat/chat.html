<div class="chat-container">
  <div class="chat-header">
    <div class="chat-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <h1>ChatSEO</h1>
    </div>
    <button class="clear-button" (click)="clearChat()" title="Clear conversation">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
      Clear Chat
    </button>
  </div>

  <div class="chat-messages" #messagesContainer>
    @for (message of chatService.messages(); track message.id) {
      <app-message [message]="message" />
    }
  </div>

  <div class="chat-input-container">
    <div class="input-wrapper">
      <textarea
        class="chat-input"
        [(ngModel)]="userInput"
        (keypress)="handleKeyPress($event)"
        placeholder="Ask me anything about SEO..."
        rows="1"
      ></textarea>
      <button
        class="send-button"
        (click)="sendMessage()"
        [disabled]="!userInput().trim()"
        title="Send message"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">
      Try asking: "How do I improve my keyword research?" or "What are best practices for meta descriptions?"
    </div>
  </div>
</div>
